title: "0x3xploit"
description: "Security Research & Reverse Engineering — Windows internals, kernel exploitation, hypervisors, and low-level systems programming."
url: "https://0x3xploit.xyz"
baseurl: ""

author:
  name: "0x3xploit"
  github: "0x3xploit"
  twitter: "0x3xploit"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false

# Plugins (all GitHub Pages supported)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Feed
feed:
  path: feed.xml

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - hackermans.gif
  - tohappy.gif
  - post-template.html
